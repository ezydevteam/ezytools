# /etc/nginx/sites-available/ezytools
# Symlink: ln -s /etc/nginx/sites-available/ezytools /etc/nginx/sites-enabled/

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name ezytools.app www.ezytools.app;
    return 301 https://$host$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    server_name ezytools.app www.ezytools.app;
    root /var/www/ezytools/public;
    index index.php;

    # ─── SSL (Certbot will fill these) ───
    ssl_certificate     /etc/letsencrypt/live/ezytools.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ezytools.app/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ─── Security Headers ───
    add_header X-Frame-Options           "SAMEORIGIN"    always;
    add_header X-Content-Type-Options    "nosniff"       always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy
      "default-src 'self';
       script-src 'self' 'unsafe-inline' 'unsafe-eval'
         https://www.googletagmanager.com
         https://pagead2.googlesyndication.com
         https://cdn.jsdelivr.net
         https://fonts.googleapis.com;
       style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
       font-src 'self' https://fonts.gstatic.com;
       img-src 'self' data: https:;
       connect-src 'self';
       frame-src https://googleads.g.doubleclick.net;" always;

    # ─── Gzip Compression ───
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json
               application/javascript text/xml application/xml
               application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 1000;

    # ─── File Size Limit (50MB + buffer for Pro users) ───
    client_max_body_size 55M;

    # ─── PHP-FPM ───
    location ~ \.php$ {
        fastcgi_pass  unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include       fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # ─── Laravel Routing ───
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ─── Block Sensitive Files ───
    location ~ /\.(env|git|htaccess|htpasswd) {
        deny all;
        return 404;
    }

    # ─── Block Direct Storage Access ───
    location /storage {
        deny all;
        return 404;
    }

    # ─── Block PHP Execution in Storage/Uploads ───
    location ~* /storage/.*\.php$ {
        deny all;
        return 403;
    }

    # ─── Cache Static Assets (1 year) ───
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ─── Favicon / Robots ───
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # ─── Error Pages ───
    error_page 404 /index.php;

    # ─── Logging ───
    access_log /var/log/nginx/ezytools-access.log;
    error_log  /var/log/nginx/ezytools-error.log;
}
