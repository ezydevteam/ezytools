; /etc/fail2ban/jail.local
; Fail2Ban configuration for EzyTools server

[DEFAULT]
bantime  = 3600
findtime = 600
maxretry = 5
ignoreip = 127.0.0.1/8 ::1

[sshd]
enabled = true
port    = ssh
logpath = /var/log/auth.log
maxretry = 3

[nginx-req-limit]
enabled  = true
filter   = nginx-req-limit
logpath  = /var/log/nginx/error.log
maxretry = 10

[nginx-botsearch]
enabled  = true
filter   = nginx-botsearch
logpath  = /var/log/nginx/ezytools-access.log
maxretry = 5

[nginx-badbots]
enabled  = true
filter   = nginx-badbots
logpath  = /var/log/nginx/ezytools-access.log
maxretry = 2
